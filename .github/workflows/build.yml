name: Build and deploy Savour
on:
  push:
    branches: [main]
    paths:
      - 'trigger_imgs/**'
      - 'savour/**'
      - 'site-data/**'
      - 'site-assets/**'
      - 'scripts/**'
      - 'schemas/**'
      - '.publishing/**'
      - 'requirements.txt'
      - 'site.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: savour-pages
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: main
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Normalize post metadata
        run: python scripts/site_post_metadata.py normalize --site savour --root savour --schema-dir schemas
      - name: Test publishing behavior
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test_navigation.mjs
      - name: Normalize saved photos to WebP
        run: python scripts/normalize_images.py
      - name: Import image uploads
        run: python scripts/ingest_github.py
      - name: Validate post metadata
        run: python scripts/site_post_metadata.py check --site savour --root savour --schema-dir schemas
      - name: Validate authoritative shared metadata profile
        run: python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site savour --content-root savour --root . --schema .metadata-spec/content/content-metadata.schema.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: python scripts/build.py --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Check generated site
        run: python scripts/check.py --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Save posts and upload cursor together
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during generation. Rerun from the latest branch head.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add savour unpublished site-data .publishing/state.json .publishing/webp-conversion.json
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Normalize and import Savour photos'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public pages and images
        run: python scripts/verify_live.py
      - name: Retain newer uploads and clear only verified originals
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'A newer commit arrived. Inbox retained; the next queued run will continue.'
            exit 1
          fi
          python scripts/image_inbox.py
          git add .publishing/deployed.json
          git add -u trigger_imgs
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Record verified deployment and clear image inbox'
            git push origin HEAD:main
          fi
