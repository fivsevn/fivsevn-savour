name: Build and deploy Savour
on:
  push:
    branches: [main]
    paths:
      - 'trigger_imgs/**'
      - 'savour/**'
      - 'site-data/**'
      - 'site-assets/**'
      - 'scripts/**'
      - 'schemas/**'
      - '.publishing/**'
      - 'requirements.txt'
      - 'CNAME'
      - 'site.json'
      - '.github/spec-ref'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      compact_image_history:
        description: Compact converted image history; resync local clones afterwards
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: savour-pages
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      # Keep the Spec pin with the checked-out source and local contract copies.
      - name: Read pinned Spec revision
        id: spec_version
        shell: bash
        run: |
          spec_ref="$(cat .github/spec-ref)"
          if [[ ! "$spec_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/spec-ref must contain one full Spec commit SHA"
            exit 1
          fi
          echo "ref=$spec_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: ${{ steps.spec_version.outputs.ref }}
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Normalize post metadata
        run: python scripts/site_post_metadata.py normalize --site savour --root savour --schema-dir schemas
      - name: Test publishing behavior
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test_navigation.mjs
      - name: Verify shared contract copies
        run: |
          cmp scripts/site_post_metadata.py .metadata-spec/tools/site_post_metadata.py
          cmp scripts/media_naming.py .metadata-spec/tools/media_naming.py
          cmp schemas/content-metadata.schema.json .metadata-spec/content/content-metadata.schema.json
          cmp schemas/site-post.schema.json .metadata-spec/content/site-post.schema.json
      - name: Normalize saved photos to WebP
        run: python scripts/normalize_images.py
      - name: Import image uploads
        run: python scripts/ingest_github.py
      - name: Validate post metadata
        run: python scripts/site_post_metadata.py check --site savour --root savour --schema-dir schemas
      - name: Validate authoritative shared metadata profile
        run: python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site savour --content-root savour --root . --schema .metadata-spec/content/content-metadata.schema.json
      - name: Validate publication media and metadata
        run: |
          python scripts/media_naming.py check --site savour --root savour
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build static site
        run: python scripts/build.py --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Check generated site
        run: python scripts/check.py --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Save posts and upload cursor together
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during generation. Rerun from the latest branch head.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add savour unpublished site-data site-assets .publishing/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Normalize and import Savour photos'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public pages and images
        run: python scripts/verify_live.py
      - name: Retain newer uploads and clear only verified originals
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'A newer commit arrived. Inbox retained; the next queued run will continue.'
            exit 1
          fi
          python scripts/image_inbox.py
          git add .publishing/deployed.json
          git add -u trigger_imgs
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Record verified deployment and clear image inbox'
            git push origin HEAD:main
          fi
      - name: Prepare verified image history cleanup
        id: media_history
        if: github.event_name == 'workflow_dispatch' && inputs.compact_image_history == true
        run: |
          python -m pip install git-filter-repo==2.47.0
          python scripts/compact_media_history.py --prepare --scope savour --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/webp-history" --defer-if-pending > "$RUNNER_TEMP/webp-history-result.json"
          python - <<'PY_HISTORY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'webp-history/report.json').read_text())
          ready = report['status'] == 'prepared'
          if ready:
              assert report['protected_files_equal'] and report['cursor_ancestors_verified']
              assert report['remaining_target_paths'] == 0 and report['backup']['verified']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('Image history cleanup:', report['status'], report.get('reason', ''), 'paths:', report.get('filtered_path_count', 0))
          PY_HISTORY
      - name: Push compacted history without overwriting newer work
        if: steps.media_history.outputs.ready == 'true'
        run: python scripts/compact_media_history.py --push --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/webp-history" --defer-if-pending
      - name: Retain the image history cleanup report
        if: always() && steps.media_history.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-history-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/webp-history/report.json
            ${{ runner.temp }}/webp-history/filtered-paths.json
            ${{ runner.temp }}/webp-history/commit-map.json
            ${{ runner.temp }}/webp-history/filter-repo.log
            ${{ runner.temp }}/webp-history/push.log
          if-no-files-found: ignore
          retention-days: 1
